<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Tenancy Bot · Panel de Asesores</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;460;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       Tokens — DESIGN.md (Golden Hour Editorial Dashboard)
       ============================================================ */
    :root {
      --color-midnight-wine: #421d24;
      --color-royal-violet: #714cb6;
      --color-lilac-mist: #d4c7ff;
      --color-deep-lagoon: #0c4243;
      --color-warm-parchment: #f2f0eb;
      --color-soft-mist: #e3e3e2;
      --color-ink-charcoal: #292827;
      --color-stone-gray: #666666;
      --color-paper-white: #ffffff;

      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 999px;

      --shadow-subtle: 0 1px 3px rgba(41, 40, 39, 0.05);
      --shadow-card: 0 4px 16px rgba(41, 40, 39, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--color-warm-parchment);
      color: var(--color-ink-charcoal);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Sticky Navigation Header */
    header.agent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
      height: 64px;
      background: rgba(242, 240, 235, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-soft-mist);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .header-brand .logo {
      width: 32px;
      height: 32px;
      background: var(--color-midnight-wine);
      color: var(--color-lilac-mist);
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 700;
    }

    .header-brand h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-pill {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-ink-charcoal);
      background: var(--color-paper-white);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--color-soft-mist);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-avatar-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--color-lilac-mist);
      color: var(--color-midnight-wine);
      font-size: 11px;
      font-weight: 700;
      display: grid;
      place-items: center;
    }

    /* Controles y botones */
    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    input,
    textarea,
    select {
      background: var(--color-paper-white);
      color: var(--color-ink-charcoal);
      border: 1px solid var(--color-soft-mist);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--color-midnight-wine);
      box-shadow: 0 0 0 2px rgba(66, 29, 36, 0.1);
    }

    textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: var(--radius-sm);
      padding: 9px 16px;
      font-weight: 500;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--color-midnight-wine);
      color: #ffffff;
      border-radius: var(--radius-lg);
    }

    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--color-lilac-mist);
      color: var(--color-ink-charcoal);
      border: 1px solid var(--color-ink-charcoal);
    }

    .btn-secondary:hover {
      background: #c5b5fe;
    }

    .btn-ghost {
      background: var(--color-paper-white);
      color: var(--color-ink-charcoal);
      border: 1px solid var(--color-soft-mist);
    }

    .btn-ghost:hover {
      border-color: var(--color-ink-charcoal);
    }

    .btn-danger {
      background: #dc2626;
      color: #fff;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    /* Layout general */
    .wrap {
      max-width: 1100px;
      margin: 28px auto 48px;
      padding: 0 20px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .spacer {
      flex: 1;
    }

    /* Tarjetas */
    .card {
      background: var(--color-paper-white);
      border: 1px solid var(--color-soft-mist);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-subtle);
    }

    /* Metrics Bar */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .metric-box {
      background: var(--color-paper-white);
      border: 1px solid var(--color-soft-mist);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      box-shadow: var(--shadow-subtle);
    }

    .metric-box b {
      font-size: 28px;
      font-weight: 460;
      color: var(--color-midnight-wine);
      display: block;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .metric-box span {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-stone-gray);
      font-weight: 600;
    }

    /* Ticket item */
    .ticket-card {
      background: var(--color-paper-white);
      border: 1px solid var(--color-soft-mist);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      gap: 14px;
      align-items: center;
      transition: all 0.15s ease;
    }

    .ticket-card:hover {
      border-color: var(--color-royal-violet);
      transform: translateX(2px);
      box-shadow: var(--shadow-card);
    }

    .ticket-sub {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-ink-charcoal);
      margin-bottom: 4px;
    }

    .ticket-meta {
      font-size: 12px;
      color: var(--color-stone-gray);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Chips de estado */
    .chip {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .chip.open {
      background: #dcfce7;
      color: #15803d;
    }

    .chip.pending {
      background: #fef3c7;
      color: #b45309;
    }

    .chip.closed {
      background: #f3f4f6;
      color: #6b7280;
    }

    /* Mensajes WhatsApp */
    .chat-container {
      background: var(--color-warm-parchment);
      border: 1px solid var(--color-soft-mist);
      border-radius: var(--radius-md);
      padding: 16px;
      margin: 14px 0;
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 14px;
      line-height: 1.45;
    }

    .msg-bubble.in {
      align-self: flex-start;
      background: var(--color-paper-white);
      border: 1px solid var(--color-soft-mist);
      border-bottom-left-radius: 2px;
    }

    .msg-bubble.out {
      align-self: flex-end;
      background: #faf8ff;
      border: 1px solid var(--color-lilac-mist);
      border-bottom-right-radius: 2px;
    }

    .msg-by {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-royal-violet);
      margin-bottom: 2px;
    }

    /* RAG Note */
    .rag-box {
      background: rgba(212, 199, 255, 0.2);
      border: 1px solid var(--color-lilac-mist);
      border-left: 4px solid var(--color-royal-violet);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      margin: 12px 0;
      font-size: 13px;
    }

    .rag-box b {
      color: var(--color-royal-violet);
    }

    .rag-box ul {
      margin: 6px 0 0;
      padding-left: 20px;
      color: var(--color-ink-charcoal);
    }

    .note-box {
      background: #fffbeb;
      border-left: 3px solid #f59e0b;
      padding: 8px 12px;
      margin: 6px 0;
      border-radius: 4px;
      font-size: 13px;
    }

    /* Login view */
    .login-box {
      max-width: 440px;
      margin: 80px auto;
      text-align: center;
      background: var(--color-paper-white);
      border: 1px solid var(--color-soft-mist);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      box-shadow: var(--shadow-card);
    }

    .login-box .icon {
      width: 48px;
      height: 48px;
      background: var(--color-midnight-wine);
      color: var(--color-lilac-mist);
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      font-size: 22px;
      margin: 0 auto 16px;
    }

    .login-box h2 {
      font-size: 24px;
      font-weight: 460;
      margin-bottom: 8px;
      color: var(--color-ink-charcoal);
    }

    .login-box p {
      font-size: 14px;
      color: var(--color-stone-gray);
      margin-bottom: 24px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--color-stone-gray);
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-soft-mist);
    }
  </style>
</head>

<body>

  <header class="agent-header">
    <a href="/" class="header-brand">
      <div class="logo">🤖</div>
      <div>
        <h1>Multi-Tenancy Bot</h1>
      </div>
    </a>
    <div class="header-right">
      <div class="user-pill" id="whoPill" style="display:none">
        <span class="user-avatar-circle" id="whoInitial">A</span>
        <span id="who">Asesor</span>
      </div>
      <button class="btn-ghost btn-sm" id="logout" style="display:none">Cerrar Sesión</button>
      <a href="/" class="btn-ghost btn-sm">Inicio</a>
    </div>
  </header>

  <!-- Vista Login -->
  <div class="wrap" id="login" style="display:none">
    <div class="login-box">
      <div class="icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="12" rx="2" />
          <line x1="2" y1="20" x2="22" y2="20" />
        </svg>
      </div>
      <h2>Panel de Asesores</h2>
      <p>Inicia sesión para gestionar conversaciones de WhatsApp y atender clientes en tiempo real.</p>

      <button class="btn-primary" style="width:100%; padding:12px;"
        onclick="location.href='/auth/google/login?next='+encodeURIComponent('/agent/')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            fill="#4285F4" />
          <path
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            fill="#34A853" />
          <path
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
            fill="#FBBC05" />
          <path
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
            fill="#EA4335" />
        </svg>
        Entrar con Google
      </button>

      <div class="divider">o accede mediante token JWT</div>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <input id="manualToken" placeholder="Pega tu token JWT aquí..." />
        <button class="btn-secondary" onclick="setToken(document.getElementById('manualToken').value)">Validar
          Token</button>
      </div>
    </div>
  </div>

  <!-- Vista Principal Panel de Asesores -->
  <div class="wrap" id="app" style="display:none">

    <!-- Filtro de Tenant -->
    <div class="card row">
      <label style="font-weight:600; color:var(--color-stone-gray)">Tenant Activo:</label>
      <input id="tenant" placeholder="ej. agente-salud-norte" style="width:240px" />
      <button class="btn-primary" onclick="loadAll()">Cargar Tickets</button>
      <span class="spacer"></span>
      <span style="font-size:12px; color:var(--color-stone-gray)">Actualización en vivo</span>
    </div>

    <!-- Métricas -->
    <div class="metrics-grid" id="metrics"></div>

    <!-- Lista de Tickets -->
    <div id="list"></div>

    <!-- Detalle de Ticket -->
    <div id="detail" style="display:none"></div>

  </div>

  <script>
    const $ = id => document.getElementById(id);
    let TOKEN = localStorage.getItem('multibot_agent_token') || '';

    function setToken(t) {
      t = (t || '').trim();
      if (!t) return;
      TOKEN = t;
      localStorage.setItem('multibot_agent_token', t);
      location.hash = '';
      boot();
    }
    function logout() { TOKEN = ''; localStorage.removeItem('multibot_agent_token'); location.reload(); }

    async function api(method, path, body) {
      const res = await fetch('/api/agent' + path, {
        method,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (res.status === 401) { logout(); throw new Error('Sesión expirada'); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || res.status);
      return data;
    }

    function tenantId() { return $('tenant').value.trim(); }

    async function boot() {
      if (!TOKEN) {
        $('login').style.display = '';
        $('app').style.display = 'none';
        $('whoPill').style.display = 'none';
        $('logout').style.display = 'none';
        return;
      }
      try {
        const me = await fetch('/auth/me', { headers: { Authorization: 'Bearer ' + TOKEN } });
        if (!me.ok) throw new Error('no auth');
        const u = await me.json();
        const displayName = u.name || u.email;
        $('who').textContent = displayName;
        $('whoInitial').textContent = (displayName[0] || 'A').toUpperCase();
        $('whoPill').style.display = 'flex';
        $('logout').style.display = '';
        $('login').style.display = 'none';
        $('app').style.display = '';
        $('tenant').value = localStorage.getItem('multibot_tenant') || '';
        if ($('tenant').value) await loadAll();
      } catch (e) { logout(); }
    }

    async function loadAll() {
      localStorage.setItem('multibot_tenant', tenantId());
      if (!tenantId()) return;
      await Promise.all([loadMetrics(), loadTickets()]);
    }

    async function loadMetrics() {
      try {
        const m = await api('GET', '/tenants/' + tenantId() + '/metrics');
        $('metrics').innerHTML = `
          <div class="metric-box"><b>${m.open}</b><span>Abiertos</span></div>
          <div class="metric-box"><b>${m.pending}</b><span>Pendientes</span></div>
          <div class="metric-box"><b>${m.closed}</b><span>Cerrados</span></div>
          <div class="metric-box"><b>${m.total}</b><span>Total Tickets</span></div>`;
      } catch (err) {
        $('metrics').innerHTML = '';
      }
    }

    async function loadTickets() {
      try {
        const tickets = await api('GET', '/tenants/' + tenantId() + '/tickets');
        const wrap = $('list');
        wrap.innerHTML = '<h3 style="font-size:18px; font-weight:460; margin-bottom:12px;">Bandeja de Conversaciones</h3>';
        if (!tickets || !tickets.length) {
          wrap.innerHTML += '<div class="card" style="text-align:center; color:var(--color-stone-gray); padding:32px">No hay tickets registrados para este tenant.</div>';
          return;
        }
        tickets.forEach(t => {
          const el = document.createElement('div');
          el.className = 'ticket-card';
          el.onclick = () => openTicket(t.ticket_id);
          el.innerHTML = `
            <div style="flex:1">
              <div class="ticket-sub">${esc(t.subject || 'Consulta por WhatsApp')}</div>
              <div class="ticket-meta">
                <span>#${t.ticket_id}</span>
                <span>•</span>
                <span>Conv: ${esc(t.conversation_id)}</span>
                <span>•</span>
                <span>Asignado: <strong>${esc(t.assigned_to || 'Sin asignar')}</strong></span>
              </div>
            </div>
            <span class="chip ${t.status}">${t.status}</span>`;
          wrap.appendChild(el);
        });
      } catch (err) {
        $('list').innerHTML = `<div class="card" style="color:#dc2626">Error al cargar tickets: ${esc(err.message)}</div>`;
      }
    }

    async function openTicket(id) {
      try {
        const t = await api('GET', '/tenants/' + tenantId() + '/tickets/' + id);
        const d = $('detail');
        d.style.display = '';
        d.innerHTML = `
          <div class="card">
            <div class="row" style="margin-bottom:12px;">
              <h3 style="font-size:20px; font-weight:460; margin:0">#${t.ticket_id} — ${esc(t.subject)}</h3>
              <span class="chip ${t.status}">${t.status}</span>
              <span class="spacer"></span>
              <button class="btn-ghost btn-sm" onclick="claim('${id}')">Reclamar</button>
              <button class="btn-ghost btn-sm" onclick="release('${id}')">Liberar</button>
              <button class="btn-secondary btn-sm" onclick="$('detail').style.display='none'; loadTickets()">← Volver a lista</button>
            </div>
            
            <p style="font-size:13px; color:var(--color-stone-gray); margin-bottom:8px">
              Asignado a: <strong>${esc(t.assigned_to || 'Sin asignar')}</strong>
            </p>

            ${t.meta && t.meta.rag_sources && t.meta.rag_sources.length ? `
            <div class="rag-box">
              <b>✦ Fuentes RAG consultadas por la IA:</b>
              <ul>
                ${t.meta.rag_sources.map(s => `<li>${esc(s.source)} · pág. ${esc(s.page)} (relevancia: ${s.score})</li>`).join('')}
              </ul>
            </div>` : ''}

            <!-- Hilo de Mensajes WhatsApp -->
            <div class="chat-container" id="msgs">
              ${(t.messages || []).map(m => `
                <div class="msg-bubble ${m.direction}">
                  <div class="msg-by">${esc(m.sender || (m.direction === 'in' ? 'Cliente' : 'Asesor / Bot'))}</div>
                  <div>${esc(m.body)}</div>
                </div>
              `).join('')}
            </div>

            <!-- Notas internas -->
            <div id="notes">
              ${(t.notes || []).map(n => `
                <div class="note-box">
                  <strong>${esc(n.author)}:</strong> ${esc(n.body)}
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Acciones de Respuesta -->
          <div class="card">
            <h4 style="font-size:15px; font-weight:600; margin-bottom:8px">Responder al Cliente (WhatsApp)</h4>
            <textarea id="replyText" placeholder="Escribe el mensaje que se enviará al WhatsApp del cliente..."></textarea>
            
            <div class="row" style="margin-top:10px">
              <button class="btn-primary" onclick="reply('${id}')">Enviar a WhatsApp</button>
              <span class="spacer"></span>
              <input id="noteText" placeholder="Añadir nota interna..." style="width:260px" />
              <button class="btn-ghost" onclick="addNote('${id}')">Guardar Nota</button>
            </div>

            <div class="row" style="margin-top:14px; padding-top:12px; border-top:1px solid var(--color-soft-mist)">
              <span style="font-size:12px; color:var(--color-stone-gray); font-weight:600">Transferir Ticket:</span>
              <input id="transferTo" placeholder="email del agente destino" style="width:200px" />
              <input id="transferNote" placeholder="motivo de la transferencia" style="flex:1" />
              <button class="btn-ghost btn-sm" onclick="transfer('${id}')">Transferir</button>
            </div>
          </div>`;
        window.scrollTo({ top: d.offsetTop - 80, behavior: 'smooth' });
      } catch (err) {
        alert('Error al abrir ticket: ' + err.message);
      }
    }

    function myEmail() { return TOKEN ? JSON.parse(atob(TOKEN.split('.')[1])).email : 'agente'; }
    async function claim(id) { await api('POST', `/tenants/${tenantId()}/tickets/${id}/claim`, { agent_email: myEmail() }); loadAll(); openTicket(id); }
    async function release(id) { await api('POST', `/tenants/${tenantId()}/tickets/${id}/release`, { agent_email: myEmail() }); openTicket(id); }
    async function addNote(id) {
      const note = $('noteText').value.trim();
      if (!note) return;
      await api('POST', `/tenants/${tenantId()}/tickets/${id}/notes`, { note, author: myEmail() });
      openTicket(id);
    }
    async function transfer(id) {
      const to_agent = $('transferTo').value.trim();
      if (!to_agent) return;
      await api('POST', `/tenants/${tenantId()}/tickets/${id}/transfer`, { to_agent, note: $('transferNote').value, author: myEmail() });
      openTicket(id);
    }
    async function reply(id) {
      const message = $('replyText').value.trim();
      if (!message) return;
      await api('POST', `/tenants/${tenantId()}/tickets/${id}/reply`, { message, author: myEmail() });
      openTicket(id);
    }

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    $('logout').onclick = logout;
    if (location.hash.startsWith('#token=')) setToken(location.hash.slice(7));
    else boot();
  </script>
</body>

</html>
